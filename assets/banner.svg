<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="40%" stop-color="#0d1527" />
      <stop offset="80%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="0" r="1.2" fill="#6366f1" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      fill: #38bdf8;
      font-size: 13px;
      letter-spacing: 1.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient Pulse Animation */
    @keyframes orbPulse1 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(30px, -20px); opacity: 0.55; }
    }
    @keyframes orbPulse2 {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.3; }
      50% { transform: scale(1.2) translate(-25px, 25px); opacity: 0.5; }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -100; }
    }
    @keyframes nodeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .orb-anim-1 { animation: orbPulse1 9s ease-in-out infinite; transform-origin: 220px 140px; }
    .orb-anim-2 { animation: orbPulse2 11s ease-in-out infinite; transform-origin: 1060px 240px; }
    .stream-line { stroke-dasharray: 8, 8; animation: dashTravel 4s linear infinite; }
    .float-card-1 { animation: nodeFloat 6s ease-in-out infinite; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1280" height="400" fill="url(#bgGradient)" />

  <!-- Subtle Perspective Grid -->
  <rect width="1280" height="400" fill="url(#cyberGrid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-anim-1">
    <circle cx="220" cy="140" r="160" fill="url(#accentGradient1)" filter="url(#glow)" />
  </g>
  <g class="orb-anim-2">
    <circle cx="1060" cy="240" r="180" fill="url(#accentGradient2)" filter="url(#glow)" />
  </g>

  <!-- Ambient Dynamic Workflow Waves (Background Layer) -->
  <path d="M-50,300 C300,180 500,380 850,260 C1050,190 1200,310 1350,240" fill="none" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.35" class="stream-line" />
  <path d="M-50,340 C350,220 550,420 900,300 C1100,230 1250,350 1350,280" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.25" class="stream-line" style="animation-duration: 6s;" />

  <!-- Foreground Content: Pill Badge -->
  <g transform="translate(80, 56)">
    <rect width="280" height="32" rx="16" fill="url(#badgeGrad)" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="tagline-text">CURATED ARCHITECTURE &amp; STACK</text>
  </g>

  <!-- Title & Subtitle in foreground -->
  <g transform="translate(80, 142)">
    <text x="0" y="0" class="title-text" font-size="42">Creative Workflow &amp; Asset Management</text>
    <text x="0" y="42" class="subtitle-text" font-size="19">Digital Asset Management (DAM) • Content Supply Chain • Brand Portals • Open Pipelines</text>
  </g>

  <!-- Dynamic Feature Badges / Metadata Cards -->
  <g transform="translate(80, 240)" class="float-card-1">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="44" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
      <text x="20" y="27" class="pill-text">⚡ DAM Ecosystem</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(186, 0)">
      <rect width="180" height="44" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
      <text x="20" y="27" class="pill-text">🎨 Brand Guidelines</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(382, 0)">
      <rect width="190" height="44" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
      <text x="20" y="27" class="pill-text">🔄 Approval Pipelines</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(588, 0)">
      <rect width="200" height="44" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
      <text x="20" y="27" class="pill-text">🌐 Self-Hosted &amp; SaaS</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(804, 0)">
      <rect width="180" height="44" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" filter="url(#softGlow)" />
      <text x="20" y="27" class="pill-text">🚀 Production Flow</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="396" width="1280" height="4" fill="url(#accentGradient1)" />
</svg>
